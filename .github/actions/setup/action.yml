name: Setup
description: Install Vite+, Node.js, and workspace dependencies

inputs:
  registry-url:
    description: npm registry URL for publish jobs
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@0cffb0a1ac50daa1541b57d1eb7c843f479522e1 # v1.18.0
      with:
        node-version: "22"
        cache: true
        run-install: false
        registry-url: ${{ inputs.registry-url }}

    - run: vp install --frozen-lockfile
      shell: bash
