name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge on release PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          if [ -z "$PRS" ] || [ "$PRS" = "[]" ]; then
            echo "No release PRs to auto-merge"
            exit 0
          fi
          echo "$PRS" | jq -r '.[].number' | while read -r number; do
            [ -n "$number" ] || continue
            if gh pr merge "$number" --auto --squash; then
              echo "Enabled auto-merge for #${number}"
            else
              gh pr view "$number" --json autoMergeRequest,mergeable,mergeStateStatus
              echo "Could not enable auto-merge for #${number}"
            fi
          done

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - run: vp run ready

      - name: Publish ${{ matrix.path }}
        working-directory: ${{ matrix.path }}
        run: vp pm publish --access public --no-git-checks --provenance
